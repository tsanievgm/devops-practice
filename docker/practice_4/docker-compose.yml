version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: secret123
      POSTGRES_USER: appuser
      POSTGRES_DB: myappdb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    environment:
      APP_NAME: myapp-backend
      DB_HOST: db
      DB_PORT: 5432
    depends_on: 
      - db
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL"]


  frontend:
    build: ./frontend
    environment:
      APP_NAME: myapp-frontend
      BACKEND_URL: http://myapp-backend:5000
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - app-network
    healthcheck:        
      test: ["CMD-SHELL"]


volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
